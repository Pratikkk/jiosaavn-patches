name: Build JioSaavn Patches

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Patch Bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          ndk-version: r26c
          cmdline-tools-version: 13.0
          # Disable problematic package resolution
          architecture: x64

      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -la $ANDROID_HOME/cmdline-tools/ 2>/dev/null || true
          ls -la $ANDROID_HOME/platforms/ 2>/dev/null || true
          ls -la $ANDROID_HOME/build-tools/ 2>/dev/null || true

      - name: Install Missing SDK Components (fallback)
        if: failure()
        run: |
          echo "Installing missing SDK components..."
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" || true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Patch Bundle
        run: ./gradlew :patches:assembleRelease --no-daemon

      - name: Verify Output
        run: |
          ls -la patches/build/mpp/
          test -f patches/build/mpp/patches-1.0.0.mpp

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: patches/build/mpp/patches-1.0.0.mpp
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jiosaavn-patches
          path: patches/build/mpp/*.mpp
          retention-days: 30